<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnimeForge - 100% Client-Side Anime Upscaler & Background Remover</title>
    <meta name="description" content="Upscale anime art up to 4x and remove backgrounds with hair-strand precision. Runs 100% locally in your browser with WebGPU & ONNX." />
    
    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AnimeForge - Browser-Based Anime AI Studio" />
    <meta property="og:description" content="AI upscaling and background removal running 100% client-side with zero server uploads." />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="./assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  </head>
  <body class="bg-[#0b0f19] text-slate-100 min-h-screen antialiased selection:bg-purple-500 selection:text-white">
    <div id="root"></div>

    <!-- Development entry point for Vite -->

    <!-- Resilient Static Production Fallback:
         If hosted on static GitHub Pages without Vite build step,
         this mounts the pre-bundled production app. -->
    <script>
      (function() {
        function checkAndMount() {
          var root = document.getElementById('root');
          if (root && root.childElementCount === 0) {
            if (!document.querySelector('link[href*="index.css"]')) {
              var link = document.createElement('link');
              link.rel = 'stylesheet';
              link.href = './assets/index.css?v=5';
              document.head.appendChild(link);
            }
            var s = document.createElement('script');
            s.type = 'module';
            s.crossOrigin = 'anonymous';
            s.src = './assets/index.js?v=5';
            document.body.appendChild(s);
          }
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() { setTimeout(checkAndMount, 300); });
        } else {
          setTimeout(checkAndMount, 300);
        }
      })();
    </script>
  </body>
</html>
